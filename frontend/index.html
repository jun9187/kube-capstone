<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hotel Booking</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  header { display: flex; justify-content: space-between; align-items: center; }
  #auth-forms { display: flex; gap: 2rem; flex-wrap: wrap; }
  #auth-forms form { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-width: 220px; }
  #auth-forms h2 { font-size: 1rem; margin-top: 0; margin-bottom: 0.25rem; }
  #search-form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
  #search-form label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 0.25rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.6rem 0; border-bottom: 1px solid #ddd; }
  .room-type { font-weight: 600; }
  .price { color: #555; font-size: 0.9rem; }
  .hotel-name { font-weight: 600; }
  .dates { color: #555; font-size: 0.85rem; display: block; }
  .status { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap; }
  .status.pending { background: #fff3cd; color: #7a5b00; }
  .status.confirmed { background: #d4edda; color: #14532d; }
  .status.failed { background: #f8d7da; color: #7f1d1d; }
  .status.cancelled { background: #e2e3e5; color: #383d41; }
  button.book { white-space: nowrap; }
  button.cancel { background: none; border: none; color: #b00020; cursor: pointer; font-size: 1rem; }
  #error { color: #b00020; margin-bottom: 1rem; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Hotel Booking</h1>
    <button id="logout-btn" hidden>Log out</button>
  </header>
  <div id="error"></div>

  <section id="auth-forms">
    <form id="login-form">
      <h2>Log in</h2>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <form id="register-form">
      <h2>Register</h2>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password (min 8 chars)" required minlength="8">
      <button type="submit">Register</button>
    </form>
  </section>

  <section id="app" hidden>
    <form id="search-form">
      <label>Hotel
        <select name="hotel_id" id="hotel-select" required></select>
      </label>
      <label>Check-in
        <input name="check_in" type="date" required>
      </label>
      <label>Check-out
        <input name="check_out" type="date" required>
      </label>
      <button type="submit">Search</button>
    </form>
    <ul id="rooms"></ul>

    <h2>My bookings</h2>
    <ul id="bookings"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
