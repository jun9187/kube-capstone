name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "worker/**"
      - "frontend/**"
      - ".github/workflows/build-push.yml"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            context: ./api
          - name: worker
            context: ./worker
          - name: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            jun9187/hotel-booking-${{ matrix.service.name }}:${{ github.sha }}
            jun9187/hotel-booking-${{ matrix.service.name }}:latest

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          rm kustomize.tar.gz

      - name: Bump image tags to this commit's SHA
        working-directory: k8s/base
        run: |
          kustomize edit set image \
            hotel-booking-api=jun9187/hotel-booking-api:${{ github.sha }} \
            hotel-booking-worker=jun9187/hotel-booking-worker:${{ github.sha }} \
            hotel-booking-frontend=jun9187/hotel-booking-frontend:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes, nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump image tags to ${{ github.sha }}"
          git push
