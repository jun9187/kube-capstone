apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jun9187/kube-capstone.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: hotel-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
