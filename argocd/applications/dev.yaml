apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jun9187/kube-capstone.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: hotel-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
