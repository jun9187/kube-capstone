apiVersion: batch/v1
kind: CronJob
metadata:
  name: cancel-stale-bookings
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: cancel-stale
        spec:
          restartPolicy: Never
          containers:
            - name: cancel-stale
              image: hotel-booking-worker:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "cancel_stale.py"]
              envFrom:
                - configMapRef:
                    name: shared-config
                - configMapRef:
                    name: worker-config
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: DB_PASSWORD
