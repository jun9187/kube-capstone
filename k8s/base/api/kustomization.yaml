apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml

configMapGenerator:
- name: api-config
  literals:
  - JWT_EXPIRE_MINUTES=60
  - CACHE_TTL_SECONDS=15

# api-secrets Secret is NOT managed here — it's created manually,
# directly in-cluster, in each namespace (hotel-dev, hotel-staging).
# See docs/k8s-progress.md for why (GitOps + secrets stopgap).