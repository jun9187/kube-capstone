apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- literals:
  - DB_HOST=postgres
  - DB_PORT=5432
  - DB_NAME=hotel
  - DB_USER=hotel
  - DB_SSLMODE=disable
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  name: shared-config

# db-credentials Secret is NOT managed here — it's created manually,
# directly in-cluster, in each namespace (hotel-dev, hotel-staging).
# See docs/k8s-progress.md for why (GitOps + secrets stopgap).
