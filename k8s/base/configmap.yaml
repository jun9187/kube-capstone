apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "hotel"
  DB_USER: "hotel"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  API_HOST: "api"
  API_PORT: "8000"
  JWT_EXPIRE_MINUTES: "60"
  CACHE_TTL_SECONDS: "15"
  PROCESSING_DELAY_SECONDS: "2"
  PAYMENT_FAILURE_RATE: "0.15"
  STALE_HOLD_MINUTES: "15"
