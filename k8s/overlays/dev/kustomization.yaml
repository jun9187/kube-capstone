apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-dev

resources:
- ../../base
- namespace.yaml

components:
- ../../components/postgres

patches:
- target:
    kind: Service
    name: frontend
  patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: frontend
    spec:
      type: NodePort